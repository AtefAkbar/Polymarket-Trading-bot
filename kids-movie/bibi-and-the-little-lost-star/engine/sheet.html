<!doctype html>
<html><head><meta charset="utf-8">
<style>body{margin:0;background:#222}canvas{display:block}</style>
</head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="util.js"></script>
<script>var LIGHTS = [];</script>
<script src="chars.js"></script>
<script>
const c = document.getElementById('cv').getContext('2d');
function pose(over) {
  return Object.assign({ x: 0, y: 0, s: 1, flip: 1, t: 1.3, phase: 0, speed: 0, anim: 'idle', face: blendEmo('neutral', 'neutral', 0), blink: 0, look: .3, lookY: 0, speech: 0, lift: 0, bright: .8 }, over);
}
window.drawSheet = function (variant) {
  c.setTransform(1, 0, 0, 1, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, '#2c2a5e'); g.addColorStop(1, '#2f5a55');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.fillStyle = '#3b7a55'; c.fillRect(0, 880, 1920, 200);
  LIGHTS.length = 0;
  const emos = variant === 1
    ? ['sad', 'scared', 'joy', 'surprised', 'determined', 'cry']
    : ['neutral', 'happy', 'giggle', 'proud', 'worried', 'sleepy'];
  // row of Bibi emotions (scaled down)
  emos.forEach((e, i) => DRAW.bibi(c, pose({ x: 190 + i * 300, y: 520, s: .62, face: EMO[e] && blendEmo(e, e, 0), speech: i === 2 ? .8 : 0, lantern: i === 0 })));
  // cast
  DRAW.mama(c, pose({ x: 220, y: 1000, s: .8, face: blendEmo('happy', 'happy', 0) }));
  DRAW.bibi(c, pose({ x: 560, y: 1000, s: .95, anim: 'walk', phase: .3, speed: 200, lantern: true, face: blendEmo('happy', 'happy', 0), speech: .4 }));
  DRAW.tuck(c, pose({ x: 1010, y: 1000, s: .95, face: blendEmo('neutral', 'neutral', 0) }));
  DRAW.odo(c, pose({ x: 1450, y: 1000, s: .95, face: blendEmo('grumpy', 'grumpy', 0), speech: .5 }));
  DRAW.luma(c, pose({ x: 1760, y: 880, s: .85, face: blendEmo('happy', 'happy', 0), bright: variant === 1 ? .15 : .9 }));
};
</script>
</body></html>
